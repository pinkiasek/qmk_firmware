YAML
name: Build K5 Max Firmware
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Compile
        run: |
          qmk compile -kb keychron/k5_max/iso/rgb -km keychron || qmk compile -kb keychron/k5_max/iso/white -km keychron
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: k5-max-firmware
          path: .build/*.bin
