name: Build K5 Max Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Compile
        run: |
          qmk compile -kb keychron/k5_max/iso/rgb -km keychron || qmk compile -kb keychron/k5_max/iso/white -km keychron

      - name: List Generated Files
        run: |
          echo "Hledání vygenerovaných .bin souborů:"
          find . -name "*.bin"

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: k5-max-firmware
          path: "**/*.bin"
